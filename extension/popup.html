<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #0f1419;
        --bg-elev: #1a2028;
        --bg-elev-2: #232a34;
        --text: #e8eaed;
        --text-dim: #9aa0a6;
        --text-mute: #5f6368;
        --border: #2d3540;
        --brand: #6366f1;
        --brand-dim: #4f46e5;
        --green: #2ecc71;
        --orange: #f39c12;
        --red: #e74c3c;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        width: 320px;
        padding: 0;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
      }
      .header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 26px;
        height: 26px;
        background: linear-gradient(135deg, var(--brand), #8b5cf6);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 900;
        font-size: 14px;
        letter-spacing: -0.5px;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .platform-badge {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 10px;
        background: var(--bg-elev-2);
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        margin-left: 6px;
      }
      .platform-badge.mh { background: rgba(228, 0, 43, 0.2); color: #ff5577; }
      .platform-badge.pearson { background: rgba(0, 122, 204, 0.2); color: #4ab3ff; }
      .gear {
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 16px;
        padding: 4px;
        border-radius: 4px;
        line-height: 1;
        margin-left: auto;
      }
      .gear:hover { background: var(--bg-elev-2); color: var(--text); }

      .section { padding: 14px 16px; }

      .platform-warn {
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        text-align: center;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .platform-warn b { color: var(--text); }
      .platform-warn a {
        color: var(--brand);
        text-decoration: none;
        display: block;
        margin-top: 6px;
      }

      /* Hero start button */
      .hero-btn {
        width: 100%;
        height: 56px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: all 0.15s;
        letter-spacing: 0.2px;
      }
      .hero-btn.start {
        background: var(--brand);
        color: #fff;
      }
      .hero-btn.start:hover { background: #818cf8; box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
      .hero-btn.stop {
        background: var(--bg-elev-2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .hero-btn.stop:hover { background: #2e3742; }
      .hero-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .hero-btn .icon { font-size: 18px; }

      /* Status line */
      .status-line {
        margin-top: 10px;
        padding: 8px 12px;
        background: var(--bg-elev);
        border-radius: 6px;
        font-size: 11px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
        border-left: 3px solid var(--text-mute);
      }
      .status-line.solving { border-left-color: var(--brand); color: var(--text); }
      .status-line.waiting { border-left-color: var(--orange); }
      .status-line.idle { border-left-color: var(--text-mute); }
      .status-line.stopped { border-left-color: var(--text-mute); opacity: 0.6; }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-mute);
        flex-shrink: 0;
      }
      .status-line.solving .status-dot { background: var(--brand); animation: pulse 1.2s infinite; }
      .status-line.waiting .status-dot { background: var(--orange); animation: pulse 1.5s infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .status-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .stats-card {
        background: var(--bg-elev);
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
      }
      .stats-row { display: flex; justify-content: space-between; align-items: baseline; }
      .stats-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
      .stats-big { font-size: 22px; font-weight: 700; }
      .acc-bar-wrap {
        height: 4px;
        background: var(--bg);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 8px;
      }
      #accBar {
        height: 100%;
        width: 0;
        background: var(--green);
        transition: width 0.3s, background 0.2s;
      }

      .breakdown { margin-top: 10px; }
      .type-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        margin-top: 5px;
      }
      .type-label { flex: 1; color: var(--text-dim); text-transform: capitalize; }
      .type-pct { font-weight: 600; min-width: 32px; text-align: right; }
      .type-count { color: var(--text-mute); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

      .activity { margin-top: 12px; }
      .activity-title { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
      .activity-list {
        max-height: 130px;
        overflow-y: auto;
        background: var(--bg-elev);
        border-radius: 6px;
        padding: 4px;
      }
      .activity-list::-webkit-scrollbar { width: 6px; }
      .activity-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      .activity-empty { padding: 12px; text-align: center; color: var(--text-mute); font-size: 10px; }
      .activity-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 10px;
      }
      .activity-icon {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .activity-icon.ok { background: var(--green); }
      .activity-icon.bad { background: var(--red); }
      .activity-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }

      .settings {
        display: none;
        margin-top: 12px;
        padding: 12px;
        background: var(--bg-elev);
        border-radius: 8px;
      }
      .settings.open { display: block; }
      .settings-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .settings-row:first-child { margin-top: 0; }
      .settings-row label { font-size: 11px; color: var(--text); flex: 1; }
      .settings-row select, .settings-row input[type="password"] {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 11px;
        font-family: inherit;
        max-width: 130px;
      }
      input[type="checkbox"] { accent-color: var(--brand); }

      .license-card {
        margin-top: 12px;
        padding: 10px 12px;
        background: var(--bg-elev);
        border-radius: 8px;
        border: 1px solid var(--border);
      }
      .license-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .license-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); }
      .license-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
      .license-dot.expired { background: var(--red); }
      .license-status { font-size: 11px; color: var(--text-dim); flex: 1; }
      .license-status.active { color: var(--green); font-weight: 600; }
      .license-status.expired { color: var(--red); font-weight: 600; }
      #licenseInputWrap { display: flex; gap: 6px; }
      #licenseInput {
        flex: 1;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        outline: none;
      }
      #licenseInput:focus { border-color: var(--brand); }
      #licenseActivate {
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }
      #licenseActivate:hover { background: #818cf8; }
      #licenseActivate:disabled { background: var(--bg-elev-2); color: var(--text-mute); cursor: not-allowed; }
      .license-error { margin-top: 6px; font-size: 10px; color: var(--red); min-height: 12px; }
      .license-card.active #licenseInputWrap { display: none; }

      .footer {
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">CP</div>
      <div>
        <div class="title">Coursepilot <span id="platformBadge" class="platform-badge">—</span></div>
      </div>
      <button class="gear" id="settingsToggle" title="Settings">⚙</button>
    </div>

    <div class="section">
      <div id="platformWarn" class="platform-warn" style="display:none">
        <b>Open a Recharge or MyLab page</b>
        <div style="margin-top:6px">Coursepilot only runs on supported platforms.</div>
      </div>

      <button id="startStop" class="hero-btn start" disabled>
        <span class="icon">▶</span><span id="startStopLabel">Start</span>
      </button>

      <div id="statusLine" class="status-line stopped">
        <span class="status-dot"></span>
        <span class="status-text" id="statusText">Stopped</span>
      </div>

      <div class="settings" id="settings">
        <div class="settings-row">
          <label for="autoSubmit">Auto submit + advance</label>
          <input type="checkbox" id="autoSubmit" />
        </div>
        <div class="settings-row">
          <label for="humanlike">Humanlike timing</label>
          <input type="checkbox" id="humanlike" />
        </div>
        <div class="settings-row">
          <label for="confidence">Confidence (Recharge)</label>
          <select id="confidence">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="settings-row" id="apiKeyRow">
          <label for="apiKey">OpenAI key (Pearson)</label>
          <input type="password" id="apiKey" placeholder="sk-..." />
        </div>
        <div class="settings-row" id="modelRow">
          <label for="model">Model (Pearson)</label>
          <select id="model">
            <option value="gpt-4.1">gpt-4.1</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="gpt-4.1-mini">gpt-4.1-mini</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
          </select>
        </div>
      </div>

      <div class="license-card" id="licenseCard">
        <div class="license-header">
          <span id="licenseStatusDot" class="license-dot"></span>
          <span id="licenseStatus" class="license-status">No license</span>
        </div>
        <div id="licenseInputWrap">
          <input id="licenseInput" type="text" placeholder="COURSEPILOT-XXXX-XXXX" autocomplete="off" />
          <button id="licenseActivate">Activate</button>
        </div>
        <div id="licenseError" class="license-error"></div>
      </div>

      <div class="stats-card">
        <div class="stats-row">
          <div>
            <div class="stats-label">Accuracy</div>
            <div class="stats-big" id="accBig">—</div>
          </div>
          <div style="text-align:right">
            <div class="stats-label">Solved</div>
            <div class="stats-big" id="solvedCount">0</div>
          </div>
        </div>
        <div class="acc-bar-wrap"><div id="accBar"></div></div>
        <div class="breakdown" id="breakdown"></div>
      </div>

      <div class="activity">
        <div class="activity-title">Recent</div>
        <div class="activity-list" id="activityList">
          <div class="activity-empty">No questions graded yet.</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span style="color:var(--text-mute);font-size:10px">Coursepilot v0.1</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
